# Dev and test overlay for deploy/compose.yaml (never for production). From
# the repo root, after `make images`:
#
#   tools/dev/dev-secrets.sh
#   podman compose -f deploy/compose.yaml -f tools/dev/compose.yaml --env-file tools/dev/dev.env up -d
#   tools/dev/dev-ca.sh /path/to/dev-ca.crt   # root CA of the TLS front, for SSL_CERT_FILE / --cacert
#
# It adds:
#   mock        recap-mock: mock ASR, LLM and Docs, and a mock OIDC provider
#               for the admin UI (tools/dev/config points here)
#   minio       a dev S3 server, to test the S3 backend (dev.env selects s3)
#   minio-init  creates the bucket once
#   tls         Caddy with its local CA in front of api, for the exporter's https://
#
# Relative paths resolve against deploy/ (the directory of the first -f file),
# hence ../tools/dev/ below and in dev.env.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  mock:
    <<: *hardening
    image: ${RECAP_MOCK_IMAGE:-localhost/recap-mock:dev}
    command:
      - -listen
      - :8080
      - -fixtures
      - /fixtures
      - -asr-key
      - /run/secrets/recap/providers/asr-fixture.key
      - -llm-key
      - /run/secrets/recap/providers/llm-fixture.key
      - -docs-key
      - /run/secrets/recap/sinks/docs-s2s.key
      - -log-level
      - ${RECAP_LOG_LEVEL:-info}
      - -oidc-issuer
      - ${RECAP_OIDC_ISSUER:-}
      - -oidc-browser-url
      - ${RECAP_MOCK_OIDC_BROWSER_URL:-}
      - -oidc-client-id
      - ${RECAP_OIDC_CLIENT_ID:-recap-admin-ui}
      - -oidc-client-secret
      - /run/secrets/recap/oidc-client-secret
      - -oidc-redirect-uri
      - ${RECAP_PUBLIC_BASE_URL:-}/admin/callback
    ports:
      # The browser reaches the mock OIDC login here.
      - 127.0.0.1:${RECAP_MOCK_PORT:-8081}:8080
    volumes:
      - ${RECAP_SECRETS_DIR:-./secrets}:/run/secrets/recap:ro,z
    restart: unless-stopped
    healthcheck:
      test: [CMD, /usr/local/bin/recap-mock, -listen, ":8080", -healthcheck]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio/s3-access-key-id
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio/s3-secret-access-key
      MINIO_BROWSER: "off"
    volumes:
      - s3data:/data
      - ${RECAP_SECRETS_DIR:-./secrets}/s3-access-key-id:/run/secrets/minio/s3-access-key-id:ro,z
      - ${RECAP_SECRETS_DIR:-./secrets}/s3-secret-access-key:/run/secrets/minio/s3-secret-access-key:ro,z
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api and worker do not wait for it; they stay not ready until the bucket exists.
  minio-init:
    image: docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        mc alias set local http://minio:9000
        "$$(cat /run/secrets/minio/s3-access-key-id)" "$$(cat /run/secrets/minio/s3-secret-access-key)" >/dev/null
        && mc mb --ignore-existing "local/$$RECAP_BUCKET"
    environment:
      RECAP_BUCKET: ${RECAP_S3_BUCKET:-recap}
    # The image declares VOLUME /data; a tmpfs avoids a leftover anonymous volume.
    tmpfs:
      - /data
    volumes:
      - ${RECAP_SECRETS_DIR:-./secrets}/s3-access-key-id:/run/secrets/minio/s3-access-key-id:ro,z
      - ${RECAP_SECRETS_DIR:-./secrets}/s3-secret-access-key:/run/secrets/minio/s3-secret-access-key:ro,z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # https://127.0.0.1:${RECAP_HTTPS_PORT} with Caddy's local CA (tls internal).
  # The caddy binary needs cap_net_bind_service, so that capability stays.
  tls:
    image: docker.io/library/caddy:2.11-alpine
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ../tools/dev/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddydata:/data
    tmpfs:
      - /config
    ports:
      - 127.0.0.1:${RECAP_HTTPS_PORT:-8443}:8443
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      # TLS with the local CA works; the upstream's answer does not matter.
      test:
        - CMD
        - curl
        - -sS
        - -o
        - /dev/null
        - --cacert
        - /data/caddy/pki/authorities/local/root.crt
        - "https://127.0.0.1:8443/"
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  s3data:
  caddydata:
