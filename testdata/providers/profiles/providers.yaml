# Provider profiles fixture: the values of docs/reference/providers.md §4.1 in block
# style (one key per line, so tests can drop or change single keys). Tests
# replace each base_url with a local fake server and the credentials directory
# /run/secrets/recap/providers/ with testdata/secrets/.
schema_version: "1.0.0"
defaults:
  asr: whisperx-lab
  llm: vllm-lab
profiles:
  -
    name: whisperx-lab
    kind: asr
    dialect: whisperx-family
    base_url: https://asr.recap.test
    model: large-v3
    credentials_file: /run/secrets/recap/providers/asr-fixture.key
    max_inflight: 1
    max_file_bytes: null
    declaration:
      data_categories: [voice]
      operator: "operator's computing centre"
      location: on_prem
      retention: "No persistence; RESULT_STORE__ENABLED=false"
      deletion: manual
      used_for_training: "no"
      contract_ref: none
      reviewed_by: fixture-reviewer
      reviewed_at: "2026-10-29"
  -
    name: vllm-lab
    kind: llm
    dialect: openai-chat
    base_url: https://llm.recap.test/v1
    model: example-model
    credentials_file: /run/secrets/recap/providers/llm-fixture.key
    context_tokens: 32768
    max_output_tokens: 4096
    structured_output: json_object
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    max_inflight: 4
    declaration:
      data_categories: [transcript, chat, summary]
      operator: "operator's computing centre"
      location: on_prem
      retention: "No request logging (operator to confirm)"
      deletion: none
      used_for_training: "no"
      contract_ref: none
      reviewed_by: fixture-reviewer
      reviewed_at: "2026-10-29"
