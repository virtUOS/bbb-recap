# Where summaries go. A front end names one to four profiles per meeting
# (meta_recap-sink=docs-main,frontend-main; ADR-016).
# Reference: docs/reference/sinks.md. Keep the profiles you use; replace every
# REPLACE value. The declaration blocks are optional for docs and frontend,
# required for webhook and matrix; if present they must be complete
# (docs/reference/privacy.md §7, §11).
schema_version: "1.0.0"
sinks:
  # La Suite Docs: creates the document for the meeting owner. The key is one
  # of Docs' DJANGO_SERVER_TO_SERVER_API_TOKENS.
  - name: docs-main
    type: docs
    docs_base_url: https://docs.example.org # REPLACE
    api_key_file: /run/secrets/recap/sinks/docs.key
    # document_url_template defaults to <docs_base_url>/docs/{id}/; set it only
    # if people open Docs under another address than docs_base_url.
    # document_url_template: "https://docs.example.org/docs/{id}/"
    request_timeout: 60s
    max_inflight: 2
    max_document_bytes: 2097152
    declaration:
      data_categories: [summary, email]
      operator: "REPLACE: who runs the Docs instance"
      location: on_prem
      retention: "Document owned by the user in Docs; Docs retention policy"
      deletion: manual
  # The front end that registered the meeting fetches the summary itself.
  # No URL and no key; needs RECAP_RESULT_TTL above 0.
  - name: frontend-main
    type: frontend
    max_document_bytes: 2097152
    declaration:
      data_categories: [summary]
      operator: "registering front end"
      location: on_prem
      retention: "Until the front end fetches it, at most RECAP_RESULT_TTL after delivery"
      deletion: "ttl:7d" # keep equal to RECAP_RESULT_TTL
  # Signed webhook (Standard Webhooks) to a fixed URL, e.g. an LMS. Sends the
  # title and the links of the other sinks; content: summary also sends the
  # text. The declaration is required for this type.
  # - name: webhook-main
  #   type: webhook
  #   url: https://lms.example.org/hooks/recap # REPLACE; not a secret, no token in it
  #   signing_secret_file: /run/secrets/recap/sinks/webhook-signing.key
  #   content: notice
  #   request_timeout: 30s
  #   max_inflight: 2
  #   max_document_bytes: 2097152
  #   declaration:
  #     data_categories: [title] # [title, summary] with content: summary
  #     operator: "REPLACE: who runs the receiver"
  #     location: on_prem
  #     retention: "REPLACE: the receiver's retention"
  #     deletion: manual
  # Matrix (not supported yet: the service refuses to start with a profile
  # of type matrix): a bot account posts a short notice (title and links,
  # never the summary) to the room the room owner chose
  # (meta_recap-matrix-room). It posts to any room it is in or invited to:
  # keep it out of rooms that must not receive notices from other meetings
  # (docs/reference/sinks.md §4c). The declaration is required for this type.
  # - name: matrix-main
  #   type: matrix
  #   homeserver_url: https://matrix.example.org # REPLACE
  #   access_token_file: /run/secrets/recap/sinks/matrix-bot.token
  #   request_timeout: 30s
  #   max_inflight: 2
  #   declaration:
  #     data_categories: [title]
  #     operator: "REPLACE: who runs the homeserver"
  #     location: on_prem
  #     retention: "Room history; every member of the room can read the post"
  #     deletion: manual
