# Unit-test fixture: the profiles of providers.yaml without declarations
# (privacy.md §7: optional). Paths are relative to internal/providers.
schema_version: "1.0.0"
defaults:
  asr: whisperx-lab
  llm: vllm-lab
profiles:
  - name: whisperx-lab
    kind: asr
    dialect: whisperx-family
    base_url: https://asr.recap.test
    model: large-v3
    credentials_file: testdata/asr.key
    max_inflight: 2
    max_file_bytes: null
  - name: vllm-lab
    kind: llm
    dialect: openai-chat
    base_url: http://llm.recap.test/v1
    model: example-model
    context_tokens: 32768
    max_output_tokens: 4096
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
